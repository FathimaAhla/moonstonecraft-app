name: Deploy to Production

on:
  push:
    branches:
      - production-deploy
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SITE_URL: https://app.moonstonecraft.lk
  APP_PATH: /home/moonstonecraft-app/htdocs/app.moonstonecraft.lk

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies (needed for Wayfinder)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Prepare env for build
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > /dev/null \
            || { echo "DEPLOY_SSH_KEY is not a valid passphrase-less private key (paste the full file incl. BEGIN/END lines)"; exit 1; }
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "ssh-keyscan returned no host keys"; exit 1; }

      - name: Sync files to server
        env:
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/app' \
            --exclude='storage/logs' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/cache' \
            --exclude='public/storage' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${APP_PATH}/"

      - name: Run remote deploy commands
        env:
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          # vendor/ and public/build/ were built above and synced, so no composer or npm runs on the server.
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "bash -s -- '$APP_PATH'" << 'EOF'
            set -euo pipefail
            cd "$1"

            [ -f .env ] || { echo "Missing $1/.env - create it before deploying"; exit 1; }

            mkdir -p storage/app/public storage/framework/{cache,sessions,views} storage/logs bootstrap/cache

            php artisan down --retry=60 || true
            # Always bring the site back up, even if a step below fails.
            trap 'php artisan up' EXIT

            PHP artisan migrate --force --seed
            php artisan storage:link || true

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            php artisan queue:restart || true
          EOF

      - name: Smoke test
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          # Hit the origin directly: Cloudflare (or similar) returns 403 to GitHub runner IPs.
          host="${SITE_URL#https://}"
          code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 30 \
            --resolve "$host:443:$SSH_HOST" "$SITE_URL/up")
          echo "$SITE_URL/up -> $code"
          [ "$code" = "200" ]
